<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>말하는 구구단 놀이 (2단~10단) - 수정 버전</title>
    <style>
        /* (CSS 스타일은 이전과 동일하게 유지) */
        body {
            font-family: 'Arial', sans-serif;
            margin: 20px;
            background-color: #f4f7f6;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #ff6f61;
            margin-bottom: 30px;
        }

        .gugudan-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gugudan-table {
            width: 100%;
            border-collapse: collapse;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
            background-color: #ffffff;
            border: 3px solid #6b5b95;
            cursor: pointer; 
            transition: transform 0.2s;
        }

        .gugudan-table:hover {
            transform: translateY(-5px); 
        }

        .gugudan-table th {
            background-color: #6b5b95;
            color: white;
            font-size: 1.8em;
            padding: 15px;
            text-align: center;
        }

        .gugudan-table td {
            padding: 12px;
            font-size: 1.2em;
            text-align: center;
            border-bottom: 1px dashed #e0e0e0;
        }

        .gugudan-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .multiplier {
            font-weight: bold;
            color: #009688;
        }

        .result {
            font-weight: bold;
            color: #ff6f61;
        }
        
        .gugudan-container > div:last-child {
             grid-column: 3 / 4;
             grid-row: 3 / 4;
        }
    </style>
</head>
<body>

    <h1>🔊 말하는 구구단 놀이! (단 제목을 클릭해 보세요) 🔊</h1>

    <div class="gugudan-container">
        <script>
            // 숫자를 한국어 발음 문자열로 변환하는 함수
            // TTS가 숫자(Number)가 아닌 순수한 문자열(Text)로 인식하게 하여 오류를 줄입니다.
            function numberToKorean(num) {
                if (num === 10) return '십';
                const units = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
                return units[num];
            }

            // Web Speech API를 사용하여 텍스트를 음성으로 변환하는 함수
            function speak(text) {
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ko-KR'; 
                    utterance.rate = 0.8; 
                    
                    const voices = window.speechSynthesis.getVoices();
                    const koreanVoice = voices.find(voice => voice.lang === 'ko-KR');
                    if (koreanVoice) {
                        utterance.voice = koreanVoice;
                    }

                    window.speechSynthesis.cancel();
                    window.speechSynthesis.speak(utterance);
                } else {
                    alert("죄송합니다. 이 브라우저는 음성 합성 기능을 지원하지 않습니다.");
                }
            }
            
            // 구구단 테이블을 생성하고 음성 텍스트를 만드는 함수
            function createGugudanTable(dan) {
                let htmlContent = '';
                // 시작 문구는 숫자로 남겨서 '이 단 외워보기'가 아닌 '2단 외워보기'로 명확하게 함
                let speechText = `${dan}단 외워보기.`; 

                htmlContent += `
                    <div>
                        <table class="gugudan-table" data-dan="${dan}">
                            <thead>
                                <tr>
                                    <th colspan="3" onclick="readGugudan(${dan})">${dan}단 (클릭!)</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                const danKorean = numberToKorean(dan); // 예: '이'
                
                for (let i = 1; i <= 9; i++) {
                    const result = dan * i;
                    const iKorean = numberToKorean(i); // 예: '일'
                    
                    // 핵심 수정: '이 곱하기 일은 이' 형태로 문자열 생성.
                    // 이렇게 하면 TTS 엔진이 숫자를 읽으면서 발생하는 '점' 오류를 회피합니다.
                    speechText += `${danKorean} 곱하기 ${iKorean}는 ${result}.`; 
                    
                    htmlContent += `
                                <tr>
                                    <td>${dan}</td>
                                    <td>× <span class="multiplier">${i}</span></td>
                                    <td class="result">= ${result}</td>
                                </tr>
                    `;
                }
                
                htmlContent += `
                            </tbody>
                        </table>
                    </div>
                `;
                
                return { html: htmlContent, speech: speechText };
            }

            // 단을 선택하면 음성을 출력하는 전역 함수
            window.readGugudan = function(dan) {
                const danData = danList.find(d => d.dan === dan);
                if (danData) {
                    speak(danData.speech);
                }
            }

            const danNumbers = [2, 3, 4, 5, 6, 7, 8, 9, 10];
            const danList = []; 

            danNumbers.forEach(dan => {
                const { html, speech } = createGugudanTable(dan);
                document.write(html); 
                danList.push({ dan, speech }); 
            });
        </script>
    </div>

</body>
</html>
