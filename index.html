<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>1부터 100까지 숫자판</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: Canvas;
      color: CanvasText;
    }
    .board {
      width: min(92vw, 720px);
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
    }
    .cell {
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      border-radius: 10px;
      border: 1px solid color-mix(in oklab, CanvasText 18%, transparent);
      background: color-mix(in oklab, Canvas 92%, CanvasText 8%);
      font-weight: 600;
      font-size: clamp(14px, 2.4vw, 22px);
      transition: transform 120ms ease, background 120ms ease, box-shadow 120ms ease;
      user-select: none;
    }
    .cell:hover {
      transform: translateY(-2px);
      background: color-mix(in oklab, Canvas 86%, CanvasText 14%);
      box-shadow: 0 6px 18px -6px rgba(0,0,0,.25);
      cursor: pointer;
    }
    .header {
      margin-bottom: 14px;
      text-align: center;
      font-weight: 700;
      font-size: clamp(18px, 3.4vw, 28px);
    }
    .wrap {
      width: 100%;
      max-width: 760px;
      padding: 20px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">1부터 100까지 숫자판</div>
    <div class="board" id="board" aria-label="1부터 100까지 숫자판"></div>
  </div>

  <script>
    const board = document.getElementById('board');
    for (let n = 1; n <= 100; n++) {
      const div = document.createElement('div');
      div.className = 'cell';
      div.textContent = String(n);
      div.setAttribute('role', 'button');
      div.setAttribute('aria-label', `${n}`);
      board.appendChild(div);
    }
  </script>
</body>
</html>
