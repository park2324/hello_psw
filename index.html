<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>말하는 구구단 놀이 (2단~10단)</title>
    <style>
        /* (이전 CSS와 동일하게 유지) */
        body {
            font-family: 'Arial', sans-serif;
            margin: 20px;
            background-color: #f4f7f6;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #ff6f61;
            margin-bottom: 30px;
        }

        .gugudan-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gugudan-table {
            width: 100%;
            border-collapse: collapse;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
            background-color: #ffffff;
            border: 3px solid #6b5b95;
            /* 클릭 가능한 단 제목에 마우스 오버 효과 추가 */
            cursor: pointer; 
            transition: transform 0.2s;
        }

        /* 마우스 오버 시 살짝 들어 올리는 효과 */
        .gugudan-table:hover {
            transform: translateY(-5px); 
        }

        .gugudan-table th {
            background-color: #6b5b95;
            color: white;
            font-size: 1.8em;
            padding: 15px;
            text-align: center;
        }

        .gugudan-table td {
            padding: 12px;
            font-size: 1.2em;
            text-align: center;
            border-bottom: 1px dashed #e0e0e0;
        }

        .gugudan-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .multiplier {
            font-weight: bold;
            color: #009688;
        }

        .result {
            font-weight: bold;
            color: #ff6f61;
        }
        
        .gugudan-container > div:last-child {
             grid-column: 3 / 4;
             grid-row: 3 / 4;
        }
    </style>
</head>
<body>

    <h1>🔊 말하는 구구단 놀이! (단 제목을 클릭해 보세요) 🔊</h1>

    <div class="gugudan-container">
        <script>
            // Web Speech API를 사용하여 텍스트를 음성으로 변환하는 함수
            function speak(text) {
                // 브라우저가 SpeechSynthesis API를 지원하는지 확인
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ko-KR'; // 한국어 설정
                    utterance.rate = 0.8; // 말하는 속도 (조금 느리게)
                    
                    // 한국어 음성 찾기 (브라우저 설정에 따라 다를 수 있음)
                    const voices = window.speechSynthesis.getVoices();
                    const koreanVoice = voices.find(voice => voice.lang === 'ko-KR');
                    if (koreanVoice) {
                        utterance.voice = koreanVoice;
                    }

                    // 현재 읽고 있는 내용이 있다면 중지하고 새로 시작
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.speak(utterance);
                } else {
                    alert("죄송합니다. 이 브라우저는 음성 합성 기능을 지원하지 않습니다.");
                }
            }
            
            // 구구단 테이블을 생성하고 클릭 이벤트 리스너를 추가하는 함수
            function createGugudanTable(dan) {
                let htmlContent = '';
                let speechText = `${dan}단 외워보기.`;

                htmlContent += `
                    <div>
                        <table class="gugudan-table" data-dan="${dan}">
                            <thead>
                                <tr>
                                    <th colspan="3" onclick="readGugudan(${dan})">${dan}단 (클릭!)</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                for (let i = 1; i <= 9; i++) {
                    const result = dan * i;
                    // 음성으로 읽어줄 텍스트 생성
                    speechText += `${dan} 곱하기 ${i}는 ${result}.`;
                    
                    htmlContent += `
                                <tr>
                                    <td>${dan}</td>
                                    <td>× <span class="multiplier">${i}</span></td>
                                    <td class="result">= ${result}</td>
                                </tr>
                    `;
                }
                
                htmlContent += `
                            </tbody>
                        </table>
                    </div>
                `;
                
                // 생성된 HTML과 음성 텍스트를 반환
                return { html: htmlContent, speech: speechText };
            }

            // 단을 선택하면 음성을 출력하는 전역 함수 (HTML에서 직접 호출)
            window.readGugudan = function(dan) {
                const danData = danList.find(d => d.dan === dan);
                if (danData) {
                    speak(danData.speech);
                }
            }

            // 2단부터 10단까지의 데이터를 담은 배열
            const danNumbers = [2, 3, 4, 5, 6, 7, 8, 9, 10];
            const danList = []; // 음성 텍스트를 저장할 배열

            danNumbers.forEach(dan => {
                const { html, speech } = createGugudanTable(dan);
                document.write(html); // HTML에 테이블 추가
                danList.push({ dan, speech }); // 음성 텍스트 저장
            });
        </script>
    </div>

</body>
</html>
