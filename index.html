<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>즐거운 구구단 놀이 (2단~10단)</title>
    <style>
        /* 기본 스타일 초기화 */
        body {
            font-family: 'Arial', sans-serif;
            margin: 20px;
            background-color: #f4f7f6;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #ff6f61; /* 밝은 빨간색 */
            margin-bottom: 30px;
        }

        /* 구구단 판을 위한 Grid 컨테이너 설정 */
        .gugudan-container {
            display: grid;
            /* 3열로 설정 (2,3,4 / 5,6,7 / 8,9,10) */
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px; /* 격자 사이의 간격 */
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 각 단의 테이블 스타일 */
        .gugudan-table {
            width: 100%;
            border-collapse: collapse; /* 셀 경계선 합치기 */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden; /* 모서리 둥글게 처리 */
            background-color: #ffffff;
            border: 3px solid #6b5b95; /* 단색 테두리 */
        }

        /* 테이블 헤더 (단 제목) 스타일 */
        .gugudan-table th {
            background-color: #6b5b95; /* 보라색 계열 */
            color: white;
            font-size: 1.8em;
            padding: 15px;
            text-align: center;
        }

        /* 테이블 내용 (곱셈식) 스타일 */
        .gugudan-table td {
            padding: 12px;
            font-size: 1.2em;
            text-align: center;
            border-bottom: 1px dashed #e0e0e0;
        }

        /* 홀수 번째 행 배경색 */
        .gugudan-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        /* 곱하는 수 (1x, 2x, 3x...) 강조 */
        .multiplier {
            font-weight: bold;
            color: #009688; /* 녹색 계열 */
        }

        /* 결과 값 강조 */
        .result {
            font-weight: bold;
            color: #ff6f61; /* 밝은 빨간색 */
        }
        
        /* 10단만 특별히 3번째 줄의 첫번째 칸에 표시 */
        .gugudan-container > div:last-child {
             /* 8단, 9단 테이블이 위치한 줄의 3번째 칸을 비우고 10단을 채움 */
             /* 2,3,4 / 5,6,7 / 8,9, **(10)** */
             grid-column: 3 / 4;
             grid-row: 3 / 4;
        }
    </style>
</head>
<body>

    <h1>✨ 2단부터 10단까지 구구단 놀이! ✨</h1>

    <div class="gugudan-container">
        <script>
            // 2단부터 10단까지의 데이터를 담은 배열
            const danList = [2, 3, 4, 5, 6, 7, 8, 9, 10];
            
            danList.forEach(dan => {
                let html = `
                    <div>
                        <table class="gugudan-table">
                            <thead>
                                <tr>
                                    <th colspan="3">${dan}단</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                // 1부터 9까지 곱하기
                for (let i = 1; i <= 9; i++) {
                    html += `
                                <tr>
                                    <td>${dan}</td>
                                    <td>× <span class="multiplier">${i}</span></td>
                                    <td class="result">= ${dan * i}</td>
                                </tr>
                    `;
                }
                
                html += `
                            </tbody>
                        </table>
                    </div>
                `;
                
                // HTML에 테이블 추가
                document.write(html);
            });
        </script>
    </div>

</body>
</html>
