<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>말하는 구구단 놀이 (성공 효과 추가)</title>
    <style>
        /* (기존 CSS 스타일은 유지) */
        body {
            font-family: 'Arial', sans-serif;
            margin: 20px;
            background-color: #f4f7f6;
            color: #333;
            overflow-x: hidden; /* 컨페티가 화면 밖으로 나가도 스크롤 생기지 않게 */
        }

        h1 {
            text-align: center;
            color: #ff6f61;
            margin-bottom: 30px;
        }

        .gugudan-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gugudan-table {
            width: 100%;
            border-collapse: collapse;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
            background-color: #ffffff;
            border: 3px solid #6b5b95;
            cursor: pointer; 
            transition: transform 0.2s;
        }

        .gugudan-table:hover {
            transform: translateY(-5px); 
        }

        .gugudan-table th {
            background-color: #6b5b95;
            color: white;
            font-size: 1.8em;
            padding: 15px;
            text-align: center;
        }

        .gugudan-table td {
            padding: 12px;
            font-size: 1.2em;
            text-align: center;
            border-bottom: 1px dashed #e0e0e0;
        }

        .gugudan-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .multiplier {
            font-weight: bold;
            color: #009688;
        }

        .result {
            font-weight: bold;
            color: #ff6f61;
        }
        
        .gugudan-container > div:last-child {
             grid-column: 3 / 4;
             grid-row: 3 / 4;
        }

        /* 팝업 모달 스타일 */
        .modal-overlay {
            display: none; /* 초기에는 숨김 */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #ffc107; /* 노란색 배경 */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: pop-in 0.3s ease-out;
        }
        
        .modal-content h2 {
            font-size: 3em;
            color: #d81b60; /* 팝업 강조색 */
            margin-bottom: 10px;
        }

        .modal-content p {
            font-size: 1.5em;
            color: #333;
        }

        .modal-close-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #d81b60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.2em;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .modal-close-btn:hover {
            background-color: #ad1457;
        }
        
        /* 팝업 등장 애니메이션 */
        @keyframes pop-in {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 컨페티 스타일 (간단한 DOM 기반 구현을 위한 기본 설정) */
        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: red; /* 색상은 JS에서 랜덤하게 지정 */
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <h1>🔊 말하는 구구단 놀이! (단 제목을 클릭해 보세요) 🔊</h1>

    <div class="gugudan-container">
        </div>
    
    <div id="successModal" class="modal-overlay" onclick="document.getElementById('successModal').style.display='none'">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2>🎉 짜잔! 🎉</h2>
            <p id="modalMessage"></p>
            <button class="modal-close-btn" onclick="document.getElementById('successModal').style.display='none'">잘했어요!</button>
        </div>
    </div>
    
    <audio id="successAudio" src="/tada-fanfare-a-6313.mp3" preload="auto"></audio> 
    <script>
        // 숫자를 한국어 발음 문자열로 변환하는 함수
        function numberToKorean(num) {
            if (num === 10) return '십';
            const units = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
            return units[num];
        }

        // Web Speech API를 사용하여 텍스트를 음성으로 변환하는 함수
        function speak(text, dan) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR'; 
                utterance.rate = 0.8; 
                
                const voices = window.speechSynthesis.getVoices();
                const koreanVoice = voices.find(voice => voice.lang === 'ko-KR');
                if (koreanVoice) {
                    utterance.voice = koreanVoice;
                }

                // TTS 읽기가 끝났을 때 성공 효과 실행
                utterance.onend = function() {
                    showSuccess(dan);
                };

                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            } else {
                alert("죄송합니다. 이 브라우저는 음성 합성 기능을 지원하지 않습니다.");
                // 지원하지 않을 경우 즉시 성공 처리 (선택 사항)
                showSuccess(dan);
            }
        }
        
        // ----------------------------------------------------
        // 1. 성공 팝업 및 효과 관련 함수
        // ----------------------------------------------------

        // 성공 소리 재생 함수
        function playSuccessSound() {
            const audio = document.getElementById('successAudio');
            if (audio.src.includes('/tada-fanfare-a-6313.mp3')) {
                console.warn("경고: 성공 소리 파일 경로를 설정해주세요. (id=successAudio)");
                // 대체: 간단한 경고음 재생 (선택 사항)
                if ('AudioContext' in window) {
                    const ctx = new AudioContext();
                    const oscillator = ctx.createOscillator();
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(440, ctx.currentTime);
                    oscillator.connect(ctx.destination);
                    oscillator.start();
                    oscillator.stop(ctx.currentTime + 0.3);
                }
            } else {
                 audio.play().catch(e => console.error("오디오 재생 오류:", e));
            }
        }

        // 컨페티 생성 함수 (간단한 구현)
        function createConfetti(x, y) {
            const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#00bcd4', '#009688', '#4caf50', '#ffeb3b', '#ff9800', '#ff5722'];
            const container = document.body;

            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                // 시작 위치를 화면 중앙으로 설정
                confetti.style.left = x + 'px';
                confetti.style.top = y + 'px';
                
                // 랜덤한 이동 애니메이션을 위한 값 설정
                const angle = Math.random() * 360;
                const distance = Math.random() * 100 + 50;
                const duration = Math.random() * 1.5 + 1.5;
                
                // CSS 애니메이션
                confetti.style.transition = `transform ${duration}s ease-out, opacity ${duration}s ease-out`;
                confetti.style.opacity = 1;
                
                // 랜덤한 방향으로 튕기도록 변형
                setTimeout(() => {
                    const finalX = x + distance * Math.cos(angle);
                    const finalY = y + distance * Math.sin(angle) + 100; // 아래로 떨어지는 효과 추가
                    confetti.style.transform = `translate(${finalX - x}px, ${finalY - y}px) rotate(${Math.random() * 360}deg)`;
                    confetti.style.opacity = 0;
                }, 10);
                
                container.appendChild(confetti);
                
                // 애니메이션이 끝나면 요소 제거
                setTimeout(() => {
                    confetti.remove();
                }, duration * 1000 + 50);
            }
        }

        // 성공 효과 통합 실행 함수
        function showSuccess(dan) {
            // 1. 소리 재생
            playSuccessSound();

            // 2. 팝업 메시지 설정 및 표시
            document.getElementById('modalMessage').innerText = `${dan}단을 완벽하게 외웠어요! 대단해요!`;
            document.getElementById('successModal').style.display = 'flex';
            
            // 3. 폭죽/컨페티 효과 실행 (화면 중앙)
            createConfetti(window.innerWidth / 2, window.innerHeight / 2);
        }

        // ----------------------------------------------------
        // 2. 구구단 생성 및 TTS 로직
        // ----------------------------------------------------
            
        // 구구단 테이블을 생성하고 음성 텍스트를 만드는 함수
        function createGugudanTable(dan) {
            let htmlContent = '';
            let speechText = `${dan}단 외워보기.`; 

            htmlContent += `
                <div>
                    <table class="gugudan-table" data-dan="${dan}">
                        <thead>
                            <tr>
                                <th colspan="3" onclick="readGugudan(${dan})">${dan}단 (클릭!)</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            const danKorean = numberToKorean(dan);
            
            for (let i = 1; i <= 9; i++) {
                const result = dan * i;
                const iKorean = numberToKorean(i);
                
                // TTS 오류 방지를 위해 곱셈 부분은 한글로 변환
                speechText += `${danKorean}  ${iKorean}는 ${result}.`; 
                
                htmlContent += `
                            <tr>
                                <td>${dan}</td>
                                <td>× <span class="multiplier">${i}</span></td>
                                <td class="result">= ${result}</td>
                            </tr>
                `;
            }
            
            htmlContent += `
                        </tbody>
                    </table>
                </div>
            `;
            
            return { html: htmlContent, speech: speechText };
        }

        // 단을 선택하면 음성을 출력하는 전역 함수 (HTML에서 직접 호출)
        window.readGugudan = function(dan) {
            const danData = danList.find(d => d.dan === dan);
            if (danData) {
                // 음성 재생이 끝나면 showSuccess(dan)가 호출되도록 dan 값을 함께 전달
                speak(danData.speech, dan);
            }
        }

        // 2단부터 10단까지의 데이터를 담은 배열 생성 및 화면 출력
        const danNumbers = [2, 3, 4, 5, 6, 7, 8, 9, 10];
        const danList = []; 
        const container = document.querySelector('.gugudan-container');

        danNumbers.forEach(dan => {
            const { html, speech } = createGugudanTable(dan);
            container.innerHTML += html; // document.write 대신 innerHTML 사용
            danList.push({ dan, speech }); 
        });
    </script>
</body>
</html>
