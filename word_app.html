<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>말하는 단어장 앱</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #6b5b95;
            margin-bottom: 30px;
        }

        /* 입력 및 추가 섹션 */
        .input-section {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            width: 100%;
            max-width: 500px;
        }

        .input-section input {
            width: calc(50% - 10px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .input-section button {
            width: 100%;
            padding: 10px;
            background-color: #ff6f61;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .input-section button:hover {
            background-color: #e55c50;
        }

        /* 플래시 카드 섹션 */
        .card-section {
            margin-bottom: 30px;
            text-align: center;
        }
        
        #flashCard {
            width: 300px;
            height: 150px;
            background-color: #6b5b95;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            margin-bottom: 15px;
            transition: transform 0.3s, background-color 0.3s;
            perspective: 1000px;
            user-select: none;
        }

        #flashCard.is-flipped {
            transform: rotateY(180deg);
        }
        
        #cardContent {
            transition: transform 0.3s;
            transform-style: preserve-3d;
        }

        .card-controls button {
            padding: 8px 15px;
            margin: 0 5px;
            background-color: #009688;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* 단어 목록 섹션 */
        .list-section {
            width: 100%;
            max-width: 500px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        #wordList {
            list-style: none;
            padding: 0;
        }

        #wordList li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 1.1em;
        }

        #wordList li:last-child {
            border-bottom: none;
        }
        
        /* 버튼 그룹 컨테이너 */
        .list-buttons {
            display: flex;
            gap: 5px;
        }

        #wordList li .delete-btn,
        #wordList li .speak-btn {
            background-color: #ccc;
            color: #333;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8em;
            transition: background-color 0.2s;
        }

        #wordList li .delete-btn:hover {
            background-color: #ff6f61;
            color: white;
        }
        
        #wordList li .speak-btn:hover {
            background-color: #009688;
            color: white;
        }
    </style>
</head>
<body>

    <h1>📝 나만의 단어장</h1>

    <div class="input-section">
        <input type="text" id="wordInput" placeholder="단어 (예: Apple)">
        <input type="text" id="meaningInput" placeholder="뜻 (예: 사과)">
        <button onclick="addWord()">단어 추가</button>
    </div>
    
    <div class="card-section">
        <h2>✨ 플래시 카드 학습</h2>
        <div id="flashCard" onclick="flipCard()">
            <span id="cardContent">단어를 추가해 보세요!</span>
        </div>
        <div class="card-controls">
            <button onclick="prevWord()">이전 단어</button>
            <button onclick="nextWord()">다음 단어</button>
        </div>
    </div>

    <div class="list-section">
        <h2>📋 단어 목록</h2>
        <ul id="wordList">
            </ul>
    </div>

    <script>
        let words = JSON.parse(localStorage.getItem('myWords')) || []; 
        let currentWordIndex = 0;
        let isMeaningShown = false;

        document.addEventListener('DOMContentLoaded', () => {
            renderWordList();
            updateFlashCard();
        });

        function saveWords() {
            localStorage.setItem('myWords', JSON.stringify(words));
        }

        function addWord() {
            const wordInput = document.getElementById('wordInput');
            const meaningInput = document.getElementById('meaningInput');
            
            const word = wordInput.value.trim();
            const meaning = meaningInput.value.trim();

            if (word === "" || meaning === "") {
                alert("단어와 뜻을 모두 입력해주세요!");
                return;
            }

            words.push({ word, meaning });
            saveWords();
            
            wordInput.value = "";
            meaningInput.value = "";

            renderWordList();
            
            if (words.length === 1) {
                currentWordIndex = 0;
                updateFlashCard();
            }
        }

        function renderWordList() {
            const listElement = document.getElementById('wordList');
            listElement.innerHTML = '';

            words.forEach((item, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${item.word} - ${item.meaning}</span>
                    <div class="list-buttons">
                        <button class="speak-btn" onclick="speakWord('${item.word}')">🔊</button>
                        <button class="delete-btn" onclick="deleteWord(${index})">삭제</button>
                    </div>
                `;
                listElement.appendChild(li);
            });
        }
        
        function deleteWord(index) {
            if (confirm(`${words[index].word}를 정말 삭제하시겠습니까?`)) {
                words.splice(index, 1);
                saveWords();

                if (currentWordIndex >= words.length && words.length > 0) {
                    currentWordIndex = words.length - 1;
                } else if (words.length === 0) {
                    currentWordIndex = 0;
                }
                
                renderWordList();
                updateFlashCard();
            }
        }

        function updateFlashCard() {
            const cardContent = document.getElementById('cardContent');
            const flashCard = document.getElementById('flashCard');
            
            if (words.length === 0) {
                cardContent.innerText = '단어를 추가해 보세요!';
                flashCard.style.backgroundColor = '#6b5b95';
                isMeaningShown = false;
                return;
            }

            const currentWord = words[currentWordIndex];
            
            if (!isMeaningShown) {
                cardContent.innerText = currentWord.word;
                flashCard.style.backgroundColor = '#6b5b95';
            } else {
                cardContent.innerText = currentWord.meaning;
                flashCard.style.backgroundColor = '#009688';
            }
        }

        function flipCard() {
            if (words.length === 0) return;
            
            isMeaningShown = !isMeaningShown;
            updateFlashCard();
        }

        function nextWord() {
            if (words.length === 0) return;
            
            currentWordIndex = (currentWordIndex + 1) % words.length;
            isMeaningShown = false;
            updateFlashCard();
        }

        function prevWord() {
            if (words.length === 0) return;
            
            currentWordIndex = (currentWordIndex - 1 + words.length) % words.length;
            isMeaningShown = false;
            updateFlashCard();
        }

        // --------------------------------------------------
        // 새로운 기능: 단어 발음 기능
        // --------------------------------------------------
        function speakWord(text) {
            // SpeechSynthesis API를 지원하는지 확인
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                
                // 영어 발음으로 설정 (미국 영어)
                utterance.lang = 'en-US'; 
                
                // 속도 및 피치 조절 (선택 사항)
                utterance.rate = 1.0; 
                utterance.pitch = 1.0;

                // 이미 재생 중인 음성이 있다면 중지
                window.speechSynthesis.cancel();
                
                // 발음 시작
                window.speechSynthesis.speak(utterance);
            } else {
                alert("죄송합니다. 이 브라우저는 음성 합성 기능을 지원하지 않습니다.");
            }
        }
    </script>
</body>
</html>
